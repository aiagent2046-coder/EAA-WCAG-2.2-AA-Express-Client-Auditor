name: Validate & Package Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & bundle @monetize.software SDK 3.0
        run: |
          npm install
          npm run build

      - name: Check JS syntax
        run: |
          node --check dist-sdk/sw.js
          node --check dist-sdk/offscreen.js
          node --check dist-sdk/paywall-bridge.js
          node --check src/content/scanner.js
          node --check src/popup/popup.js
          node --check src/report/report.js

      - name: Build Chrome, Edge, and Firefox store packages
        run: python3 scripts/package_store.py

      - name: Upload store zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: dist/*.zip
