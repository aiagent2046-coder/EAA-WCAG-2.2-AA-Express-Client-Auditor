<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WCAG 2.2 AA Synthetic Compliance Test Bench v0.1.1</title>
  <style>
    body { margin: 0; font-family: sans-serif; padding-bottom: 600px; }
    header.sticky-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      background: #111827;
      color: #fff;
      z-index: 999;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    main { margin-top: 10px; padding: 20px; }
    .tiny-toolbar { display: flex; gap: 2px; margin-top: 140px; }
    .tiny-btn { width: 16px; height: 16px; padding: 0; font-size: 10px; border: 1px solid #333; background: #eee; }
    .spaced-tiny-btn { width: 18px; height: 18px; padding: 0; margin: 40px; }
    .good-btn { min-width: 32px; min-height: 32px; padding: 8px 14px; }
    .faq details { border-bottom: 1px solid #ccc; padding: 6px 0; }
    .faq summary { cursor: pointer; font-weight: 600; min-height: 28px; line-height: 28px; }
  </style>
</head>
<body>
  <header class="sticky-header">Sticky Navigation Header (90px)</header>
  <main>
    <div style="margin-top: 12px;">
      <a href="#hidden-under-sticky" id="obscured-link">Hidden Link Under Sticky Header</a>
    </div>

    <div class="tiny-toolbar">
      <button type="button" id="tiny-1" class="tiny-btn" aria-label="Edit">E</button>
      <button type="button" id="tiny-2" class="tiny-btn" aria-label="Delete">X</button>
    </div>

    <div>
      <button type="button" id="spaced-btn" class="spaced-tiny-btn" aria-label="Info">i</button>
    </div>

    <p>Read our <a href="#terms" id="inline-link" style="font-size:12px;">terms of service</a> before continuing.</p>

    <!-- Closed <details> FAQ accordion regression test (links inside closed details MUST NOT trigger false 2.4.11 or 2.5.8 fails!) -->
    <section class="faq">
      <details id="faq-1">
        <summary id="faq-sum-1">Is processing 100% local?</summary>
        <p>Yes, see <a href="#privacy-1" id="closed-faq-link-1">privacy architecture</a> and <a href="#privacy-2" id="closed-faq-link-2">offline CSP</a>.</p>
      </details>
      <details id="faq-2">
        <summary id="faq-sum-2">Can I compare PDF and Word files?</summary>
        <p>Yes, open <a href="#word-guide" id="closed-faq-link-3">Word diff guide</a>.</p>
      </details>
    </section>

    <form style="margin-top: 20px;">
      <label for="bad-pwd">Password</label>
      <input id="bad-pwd" type="password" autocomplete="off" onpaste="return false">
    </form>

    <div id="kanban-card" draggable="true" style="width:140px;height:44px;background:#dbeafe;margin-top:20px;padding:10px;">
      Draggable Card
    </div>

    <div style="margin-top: 24px;">
      <button type="button" class="good-btn">Compliant 32px Action</button>
    </div>
  </main>
</body>
</html>
