<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WCAG 2.2 AA Synthetic Compliance Test Bench</title>
  <style>
    body { margin: 0; font-family: sans-serif; padding-bottom: 600px; }
    header.sticky-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      background: #111827;
      color: #fff;
      z-index: 999;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    main { margin-top: 10px; padding: 20px; }
    .tiny-toolbar { display: flex; gap: 2px; margin-top: 140px; }
    .tiny-btn {
      width: 16px;
      height: 16px;
      padding: 0;
      font-size: 10px;
      border: 1px solid #333;
      background: #eee;
    }
    .spaced-tiny-btn {
      width: 18px;
      height: 18px;
      padding: 0;
      margin: 40px;
    }
    .good-btn {
      min-width: 32px;
      min-height: 32px;
      padding: 8px 14px;
    }
  </style>
</head>
<body>
  <header class="sticky-header">Sticky Navigation Header (90px)</header>
  <main>
    <!-- Intentionally placed right underneath the 90px fixed header so focus gets 100% obscured -->
    <div style="margin-top: 12px;">
      <a href="#hidden-under-sticky" id="obscured-link">Hidden Link Under Sticky Header</a>
    </div>

    <!-- Cramped 16x16 buttons violating SC 2.5.8 -->
    <div class="tiny-toolbar">
      <button type="button" id="tiny-1" class="tiny-btn" aria-label="Edit">E</button>
      <button type="button" id="tiny-2" class="tiny-btn" aria-label="Delete">X</button>
    </div>

    <!-- Undersized 18x18 button with generous 40px margin (passes SC 2.5.8 via Spacing circle exception) -->
    <div>
      <button type="button" id="spaced-btn" class="spaced-tiny-btn" aria-label="Info">i</button>
    </div>

    <!-- Inline link inside prose paragraph (exempt under SC 2.5.8 Inline exception) -->
    <p>Read our <a href="#terms" id="inline-link" style="font-size:12px;">terms of service</a> before continuing.</p>

    <!-- Password input blocking paste + disabling autocomplete (violates SC 3.3.8) -->
    <form style="margin-top: 20px;">
      <label for="bad-pwd">Password</label>
      <input id="bad-pwd" type="password" autocomplete="off" onpaste="return false">
    </form>

    <!-- Draggable widget requiring SC 2.5.7 manual verification -->
    <div id="kanban-card" draggable="true" style="width:140px;height:44px;background:#dbeafe;margin-top:20px;padding:10px;">
      Draggable Card
    </div>

    <div style="margin-top: 24px;">
      <button type="button" class="good-btn">Compliant 32px Action</button>
    </div>
  </main>
</body>
</html>
